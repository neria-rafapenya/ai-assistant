name: Debug GitHub OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect-oidc:
    name: Inspect OIDC claims
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Print OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN_JSON="$token_json" python3 - <<'PY'
          import base64
          import json
          import os

          response = json.loads(os.environ["TOKEN_JSON"])
          token = response["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          safe_claims = {
              key: claims.get(key)
              for key in [
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_owner",
                  "ref",
                  "environment",
                  "job_workflow_ref",
                  "repository_visibility",
              ]
          }

          print(json.dumps(safe_claims, indent=2))
          PY