name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ai-assistant-api
  ECS_CLUSTER: default
  ECS_SERVICE: ai-assistant-api-dev
  FRONTEND_BUCKET: ai-assistant-frontend-dev-740862652747
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

  VITE_API_BASE_URL: https://ai-5428103d948647f2ac9aa11b2ba6f07a.ecs.eu-west-1.on.aws
  VITE_COGNITO_ISSUER: https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_5fX8JYeKk
  VITE_COGNITO_CLIENT_ID: 4086ign9h6tpj0r5o1mhhab74n
  VITE_COGNITO_REDIRECT_URI: https://d38nzp4j8k9sdf.cloudfront.net/
  VITE_COGNITO_LOGOUT_URI: https://d38nzp4j8k9sdf.cloudfront.net/

jobs:
  deploy:
    name: Deploy API and frontend
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            -f backend/Dockerfile.backend \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            backend

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Publish frontend to S3
        run: |
          aws s3 sync frontend/dist/ \
            "s3://$FRONTEND_BUCKET/" \
            --delete

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"