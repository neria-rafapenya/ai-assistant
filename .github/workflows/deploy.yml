name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::740862652747:role/github-actions-deploy-role
  ECR_REPOSITORY: ai-assistant-api
  ECS_CLUSTER: default
  ECS_SERVICE: ai-assistant-api-dev
  ECS_SERVICE_ARN: arn:aws:ecs:eu-west-1:740862652747:service/default/ai-assistant-api-dev
  FRONTEND_BUCKET: ai-assistant-frontend-dev-740862652747
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

  VITE_API_BASE_URL: https://ai-5428103d948647f2ac9aa11b2ba6f07a.ecs.eu-west-1.on.aws
  VITE_COGNITO_ISSUER: https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_5fX8JYeKk
  VITE_COGNITO_CLIENT_ID: 4086ign9h6tpj0r5o1mhhab74n
  VITE_COGNITO_REDIRECT_URI: https://d38nzp4j8k9sdf.cloudfront.net/
  VITE_COGNITO_LOGOUT_URI: https://d38nzp4j8k9sdf.cloudfront.net/

  DYNAMODB_USAGE_TABLE_NAME: ai-assistant-usage-dev
  DAILY_TAROT_LIMIT: "5"
  DAILY_CHAT_LIMIT: "20"
  SANDBOX_USER_EMAILS: rafa@rafapenya.com
  BEDROCK_MAX_TOKENS: "384"

jobs:
  deploy:
    name: Deploy API and frontend
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            -f backend/Dockerfile.backend \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            backend

      - name: Deploy API service
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PRIMARY_CONTAINER=$(aws ecs describe-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --query 'service.activeConfigurations[0].primaryContainer' \
            --output json)
          PRIMARY_CONTAINER=$(echo "$PRIMARY_CONTAINER" | jq \
            --arg image "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg usage_table "$DYNAMODB_USAGE_TABLE_NAME" \
            --arg tarot_limit "$DAILY_TAROT_LIMIT" \
            --arg chat_limit "$DAILY_CHAT_LIMIT" \
            --arg sandbox_emails "$SANDBOX_USER_EMAILS" \
            --arg max_tokens "$BEDROCK_MAX_TOKENS" \
            '.image = $image |
             .environment = ((.environment // []) |
               map(select(.name != "DYNAMODB_USAGE_TABLE_NAME" and
                          .name != "DAILY_TAROT_LIMIT" and
                          .name != "DAILY_CHAT_LIMIT" and
                          .name != "SANDBOX_USER_EMAILS" and
                          .name != "BEDROCK_MAX_TOKENS")) +
               [{name: "DYNAMODB_USAGE_TABLE_NAME", value: $usage_table},
                {name: "DAILY_TAROT_LIMIT", value: $tarot_limit},
                {name: "DAILY_CHAT_LIMIT", value: $chat_limit},
                {name: "SANDBOX_USER_EMAILS", value: $sandbox_emails},
                {name: "BEDROCK_MAX_TOKENS", value: $max_tokens}])')
          aws ecs update-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --primary-container "$PRIMARY_CONTAINER"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Publish frontend to S3
        run: |
          aws s3 sync frontend/dist/ \
            "s3://$FRONTEND_BUCKET/" \
            --delete

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
